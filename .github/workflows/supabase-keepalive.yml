name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health"

          echo

          status=$(curl --silent --show-error --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/published_articles?select=slug&limit=1")

          echo "REST status: $status"
          if [ "$status" = "404" ]; then
            echo "La tabla published_articles aún no existe; el ping de Auth ya cuenta como actividad."
          fi
